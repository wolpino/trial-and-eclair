<section id="br-popt" aria-labelledby="br4b-h">
  <span class="label" id="br4b-h">04b · Pointing options (v2)</span>
  <div class="sec-body">
    <p class="note">Ari is not sure about the amber halftone dots. Six ways to show "you can open this", each on the recipe box while pointed at. In every one the label still turns dandelion and the dashed ring still shows for the keyboard.</p>
    <div class="trio" id="br4b-opts"></div>
  </div>
</section>
<style>
.po figure .fx-glow { opacity: 1; }
.po-b .fx-glow > rect { fill: #F6CF6E !important; opacity: .5; }
.po-c .fx-glow > rect { fill: url(#inkdots) !important; opacity: .55; }
.po-d .fx-glow > rect { fill: url(#hatch) !important; opacity: .5; }
.po-e .fx-glow { display: none; }
.po-e .lift { transform: translateY(-6px); }
.po-f .fx-glow > rect { fill: url(#sun) !important; }
.po-f figure svg { background: #f3f0dc; }
</style>
<script>
(function () {
  document.body.insertAdjacentHTML("afterbegin", '<svg width="0" height="0" style="position:absolute" aria-hidden="true"><defs><pattern id="inkdots" width="6" height="6" patternUnits="userSpaceOnUse" patternTransform="rotate(30)"><circle cx="3" cy="3" r="1.3" style="fill:#1F1D1A"/></pattern></defs></svg>');
  var O = [
    ["po-a", "P1 · Amber halftone dots (now)", "The plate look; busy next to the cork and the yellow note."],
    ["po-b", "P2 · Soft warm halo", "A plain glow of light, no dots. Quietest; the least \"printed\"."],
    ["po-c", "P3 · Ink halftone", "Small ink dots, like a print's shading. Printed, but calmer than amber."],
    ["po-d", "P4 · Hatched halo", "The same hatching as the shadows. Very printed; can read as a shadow, not a highlight."],
    ["po-e", "P5 · Lift, no glow", "The box rises 6 px off the counter and its label turns yellow. Nothing round it."],
    ["po-f", "P6 · Pale sun dots", "Cream dots like sunlight. Faint on the wall, loud on the wood and the cabinets."]
  ];
  PLATE.add(function () {
    TARGET = "the recipe box"; var k = scene(mainVP(), opts()); TARGET = null;
    var V = [940, 1260];
    document.getElementById("br4b-opts").innerHTML = O.map(function (o) {
      return '<div class="po ' + o[0] + '" id="br-' + o[0] + '"><h3>' + o[1] + "</h3><figure>" + svg(V, k.replace(/ id="(m|c)(h\d+)"/g, ' id="$1$2' + o[0] + '"').replace(/url\(#(m|c)(h\d+)\)/g, "url(#$1$2" + o[0] + ")"), o[1], 300, 260) + '</figure><span class="cap">' + o[2] + "</span></div>";
    }).join("");
  });
})();
</script>
