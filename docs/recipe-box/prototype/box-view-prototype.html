<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Recipe Box · Box View prototype</title>
<style>
:root{--bg:#efe6d8;--ink:#2b2118;--line:#d9cdb8;--w1:#b0814d;--w2:#8a5f34;--w3:#6e4a28;--inner:#4a321c;--tab:#f1e3c4;--tabopen:#fff7dc;--accent:#b5472b;--ctl:#fff;--paper:#fffaf0;--rule:#e3d6bd;color-scheme:light dark;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme=light]){--bg:#1c1712;--ink:#f1e6d6;--line:#4a3e30;--w1:#7b5630;--w2:#5f4023;--w3:#4a3019;--inner:#2e1e10;--ctl:#2b241c}}
:root[data-theme=dark]{--bg:#1c1712;--ink:#f1e6d6;--line:#4a3e30;--w1:#7b5630;--w2:#5f4023;--w3:#4a3019;--inner:#2e1e10;--ctl:#2b241c}
*,*::before,*::after{box-sizing:border-box}
html,body{height:100%;margin:0;background:var(--bg);color:var(--ink);font:15px/1.4 system-ui,-apple-system,Segoe UI,sans-serif}
.app{max-width:440px;height:100%;margin:0 auto;display:flex;flex-direction:column;padding:8px 10px 10px}
.controls{display:flex;gap:6px;justify-content:space-between;flex-wrap:wrap;margin-bottom:8px}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:999px;overflow:hidden;background:var(--ctl)}
.seg button{border:0;background:none;color:var(--ink);padding:0 12px;min-height:44px;font:inherit;font-size:14px;cursor:pointer}
.seg button[aria-pressed=true]{background:var(--accent);color:#fff}
.swatch{width:44px;padding:0!important;position:relative}.swatch i{position:absolute;inset:10px;border-radius:50%;border:1px solid rgba(0,0,0,.35);background:var(--c)}.swatch[aria-pressed=true]{background:var(--ctl)!important;box-shadow:inset 0 0 0 3px var(--accent)}
/* wood: grain + base gradient */
.grain{background:repeating-linear-gradient(90deg,rgba(0,0,0,.045) 0 1px,transparent 1px 5px,rgba(255,255,255,.035) 5px 6px,transparent 6px 13px),linear-gradient(var(--w1),var(--w2))}
/* lid: open, seen from the front. Hinge bar, side walls, dark inside back */
.lid{position:relative;flex:1 1 0;min-height:0;display:flex;padding:20px 16px 0;border-radius:12px 12px 0 0;background:linear-gradient(90deg,var(--w3),var(--w2) 14px,var(--inner) 15px,var(--inner) calc(100% - 15px),var(--w2) calc(100% - 14px),var(--w3));box-shadow:inset 0 10px 14px rgba(0,0,0,.35)}
.lid::before{content:"";position:absolute;left:0;right:0;top:0;height:11px;border-radius:12px 12px 0 0;background:linear-gradient(var(--w1),var(--w3));box-shadow:0 1px 0 rgba(255,255,255,.18) inset}
.lid::after{content:"";position:absolute;top:3px;left:50%;width:34px;height:6px;margin-left:-17px;border-radius:3px;background:linear-gradient(#d9b866,#8c6a24)}
/* card base: always lined where the paper type has lines */
.card{flex:1;overflow:hidden;padding:12px 16px;border-radius:3px 3px 0 0;background:var(--paper);color:#2b2118;font-family:Georgia,serif;box-shadow:0 1px 3px rgba(0,0,0,.35)}
.card h2{margin:0;font-size:clamp(18px,5.4vw,22px);font-weight:600;line-height:26px;font-family:inherit}
.meta{font-size:12px;line-height:22px;color:#6b5b4b}
.card h3{margin:0;font-size:11px;line-height:22px;letter-spacing:.08em;text-transform:uppercase;color:#8a7560}
.card ul,.card ol{margin:0;padding-left:18px;font-size:13px;line-height:22px}
.lined{background-image:repeating-linear-gradient(transparent 0 21px,var(--rule) 21px 22px);background-position:0 12px}
.t-typed{background-color:var(--paper)}
.t-hand{background-color:#fbf3d6;font-family:'Segoe Script','Bradley Hand','Snell Roundhand','Comic Sans MS',cursive;color:#1f3a73}
.t-hand h2{color:#1f3a73}
.t-hand ul,.t-hand ol{font-size:12.5px}
.t-card{background-color:#f6ecd0;border-top:22px solid #c8553d;--rule:#d9c9a4;font-family:'Trebuchet MS',Arial,sans-serif}
.t-card::before{content:"RECIPE CARD";display:block;margin:-20px 0 4px;color:#fff;font:700 10px/18px sans-serif;letter-spacing:.2em}
.t-cook{background:linear-gradient(90deg,#e8dcc0,#f4ecd6 8%,#f4ecd6 92%,#e8dcc0);font-family:Garamond,'Times New Roman',serif}
.t-cook h2{font-variant:small-caps;letter-spacing:.04em}
.t-cook::after{content:"142";display:block;position:absolute;right:20px;bottom:8px;font-size:11px;color:#8a7a5c}
.t-blog{background:#fff;border-top:24px solid #e6e6e6;font-family:system-ui,Arial,sans-serif}
.t-blog::before{content:"dishblog.example/recipes";display:block;margin:-20px 0 6px;color:#666;font:11px/16px sans-serif}
.t-blog h2{font-family:system-ui,Arial,sans-serif}
.card{position:relative}
.card.enter{animation:cardin .42s cubic-bezier(.2,.9,.3,1.15) both}
@keyframes cardin{from{transform:translateY(70px) scale(.96);opacity:0}}
/* box front */
.box{position:relative;flex:none}
.tabs{position:relative;z-index:2;display:flex;flex-wrap:wrap;gap:0;padding:0 10px;margin-bottom:0;touch-action:pan-y}
.tab{position:relative;flex:1 0 auto;min-height:44px;padding:4px 14px 16px;margin:0 0 -14px -5px;white-space:nowrap;text-align:center;border:1px solid rgba(0,0,0,.3);border-bottom:0;border-radius:8px 8px 0 0;background:var(--tab);color:#3a2c1c;font:600 12px/1.15 Georgia,serif;cursor:pointer;transition:transform .3s cubic-bezier(.34,1.56,.64,1),background .2s}
.tab[aria-expanded=true]{transform:translateY(-9px);background:var(--tabopen)}
.tab:disabled{opacity:.45;cursor:default}
.tab.hand{font-family:'Segoe Script','Bradley Hand','Snell Roundhand',cursive;font-weight:400;font-size:13px}
/* A-Z: one row, overlapping, letter at the exposed left edge */
.az{flex-wrap:nowrap;margin-bottom:-6px;padding:0 12px}
.az .tab{flex:1 1 0;min-width:0;min-height:28px;padding:2px 4px 0 0;margin:0 0 0 -4px;border-radius:5px 5px 0 0;text-align:center;white-space:normal;font:600 13px/1 system-ui,sans-serif}
.az.stag{display:block;height:54px;padding:0}
.az.stag .tab{position:absolute;margin:0;padding:3px 0 0;min-height:0;min-width:0}
.az.stag .tab::before{display:none}
.az .tab:first-child{margin-left:0}
.az .tab::before{content:"";position:absolute;left:-2px;right:-2px;top:-14px;height:14px}
.az .tab[aria-expanded=true]{transform:translateY(-7px)}
.sliver{flex:none;width:7px;height:21px;align-self:flex-end;margin-left:-4px;border:1px solid rgba(0,0,0,.3);border-bottom:0;border-radius:4px 4px 0 0;background:var(--tab);opacity:.8}
.front{position:relative;height:96px;display:flex;align-items:center;justify-content:center;border-radius:0 0 12px 12px;border-top:3px solid rgba(255,255,255,.28);color:rgba(60,35,12,.78);font:italic 600 24px Georgia,serif;letter-spacing:.04em;text-shadow:0 1px 0 rgba(255,255,255,.28),0 -1px 0 rgba(0,0,0,.25);box-shadow:inset 0 8px 10px -6px rgba(0,0,0,.35)}
.front::before,.front::after{content:"";position:absolute;top:8px;bottom:8px;width:2px;background:repeating-linear-gradient(transparent 0 8px,rgba(0,0,0,.28) 8px 16px)}
.front::before{left:8px}.front::after{right:8px}
.latch{position:absolute;top:8px;left:50%;width:22px;height:12px;margin-left:-11px;border-radius:3px;background:linear-gradient(#e2c277,#8f6c26);box-shadow:0 1px 1px rgba(0,0,0,.4)}
.stack{position:absolute;left:10px;right:10px;top:0;bottom:96px;z-index:1;border-radius:6px 6px 0 0;overflow:hidden;background:linear-gradient(var(--inner),#2a1b0e);box-shadow:inset 0 6px 8px rgba(0,0,0,.45)}
.stack::before{content:"";position:absolute;left:7px;right:7px;top:3px;bottom:0;border-radius:3px 3px 0 0;background:repeating-linear-gradient(180deg,#f6eed8 0 5px,#cdbf9f 5px 6px)}
.fan{position:absolute;left:0;right:0;bottom:100%;z-index:3;display:flex;gap:8px;overflow-x:auto;padding:10px 12px 14px;margin-bottom:-4px;scroll-snap-type:x proximity}
.fan[hidden]{display:none}
.mini{flex:0 0 124px;min-height:52px;padding:8px;text-align:left;scroll-snap-align:start;border:1px solid var(--line);border-radius:5px;background:var(--paper);color:#2b2118;font:inherit;cursor:pointer;box-shadow:0 1px 3px rgba(0,0,0,.35);animation:rise .32s cubic-bezier(.34,1.56,.64,1) both;animation-delay:calc(var(--i)*40ms)}
.mini b{display:block;font:600 13px/1.2 Georgia,serif}
.bubble{position:fixed;z-index:9;pointer-events:none;min-width:40px;padding:6px 12px;border-radius:8px;background:var(--accent);color:#fff;font:700 22px/1 system-ui,sans-serif;text-align:center;transform:translate(-50%,-130%)}
.bubble[hidden]{display:none}
@keyframes rise{from{transform:translateY(22px);opacity:0}}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}
:focus-visible{outline:3px solid #2f6fd8;outline-offset:2px}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<main class="app">
  <div class="controls">
    <div class="seg" role="group" aria-label="Look"><button data-look="tidy" aria-pressed="true">Tidy</button><button data-look="wild" aria-pressed="false">Wild West</button></div>
    <div class="seg" role="group" aria-label="Tabs"><button data-sort="cat" aria-pressed="true">Categories</button><button data-sort="az" aria-pressed="false">A–Z</button></div>
    <div class="seg"><button id="stress" aria-pressed="false">Test: all letters</button></div>
    <div class="seg" id="colors" role="group" aria-label="Tidy tab color"></div>
  </div>
  <section class="lid" aria-label="Selected recipe"><article class="card" id="card"></article></section>
  <section class="box">
    <div class="stack" aria-hidden="true"></div>
    <div class="fan" id="fan" hidden></div>
    <div class="tabs" id="tabs" role="group" aria-label="Divider tabs"></div>
    <div class="front grain"><i class="latch"></i>Recipes · est. 2026</div>
  </section>
  <div class="bubble" id="bubble" hidden></div>
  <p class="sr" id="live" aria-live="polite"></p>
</main>
<script>
const BASE=[
["Grandma's Apple Pie","Desserts","hand",8,80,["6 cups sliced apples","3/4 cup sugar","1/4 cup brown sugar","1 tsp cinnamon","2 tbsp butter"],["Preheat oven to 425°F.","Toss apples with sugar and cinnamon, pour into crust, dot with butter."]],
["Sunday Pancakes","Breakfast","typed",4,25,["2 cups flour","2 tbsp sugar","2 eggs","1 3/4 cups milk"],["Whisk dry, then wet, then combine.","Cook on a hot buttered griddle."]],
["Tomato Basil Soup","Soups & Salads","blog",6,40,["2 cans tomatoes","1 onion","3 cloves garlic","1 cup basil","1 cup cream"],["Sauté onion and garlic.","Simmer with tomatoes, blend, stir in cream."]],
["Lemon Chicken","Entrées","blog",4,50,["4 chicken thighs","2 lemons","4 cloves garlic","1 tbsp thyme"],["Marinate chicken in lemon, garlic and thyme.","Roast at 400°F for 35 minutes."]],
["Chimichurri","Sauces","typed",8,10,["1 cup parsley","3 cloves garlic","1/2 cup olive oil","2 tbsp vinegar"],["Chop everything fine.","Stir with oil and vinegar; rest 30 minutes."]],
["Caesar Salad","Soups & Salads","cook",4,15,["1 head romaine","1/2 cup parmesan","1 cup croutons","Caesar dressing"],["Tear the lettuce.","Toss with dressing, top with parmesan and croutons."]],
["Beef Stew","Mom's","hand",6,150,["2 lb beef chuck","4 carrots","3 potatoes","1 onion","4 cups broth"],["Brown the beef.","Add everything, simmer two hours."]],
["Chocolate Chip Cookies","Desserts","card",24,30,["2 1/4 cups flour","1 cup butter","2 cups chips","2 eggs"],["Cream butter and sugars, add eggs and flour.","Bake at 375°F for 10 minutes."]],
["Iced Chai","Drinks","blog",2,10,["2 chai tea bags","1 cup hot water","1 cup milk","2 tbsp honey"],["Steep tea five minutes.","Stir in honey and milk, pour over ice."]],
["Banana Bread","Mom's","hand",10,70,["3 ripe bananas","1/3 cup melted butter","3/4 cup sugar","1 1/2 cups flour"],["Mash bananas, stir in butter and sugar.","Fold in flour; bake at 350°F for 60 minutes."]],
["7-Layer Bars","Desserts","card",16,35,["1/2 cup butter","1 1/2 cups graham crumbs","1 cup chips","1 cup coconut","1 can condensed milk"],["Press crumbs and butter into the pan.","Layer the rest; bake at 350°F for 25 minutes."]],
["Pesto","Sauces","cook",6,10,["2 cups basil","1/2 cup pine nuts","1/2 cup parmesan","1/2 cup olive oil"],["Pulse basil, nuts and garlic.","Stream in oil, stir in cheese."]],
["Apple Cider","Drinks","typed",8,30,["8 apples","2 cinnamon sticks","1 orange","1/4 cup maple syrup"],["Simmer everything in water for 20 minutes.","Strain and serve warm."]]
].map(a=>({t:a[0],cat:a[1],type:a[2],s:a[3],m:a[4],ing:a[5],st:a[6]}));
const CATS=[['Breakfast'],['Entrées'],['Soups & Salads'],['Sauces'],['Desserts'],['Drinks'],["Mom's",true]]; // [name, customHandwriting]
const LET='ABCDEFGHIJKLMNOPQRSTUVWXYZ#'.split('');
const SRC={typed:'Typed',hand:'Handwritten card scan',card:'Recipe card scan',cook:'Cookbook scan',blog:'Web import'};
let R=BASE.slice(),look='tidy',sort='cat',sel=0,open=null;
const $=id=>document.getElementById(id);
const keyOf=r=>sort==='cat'?r.cat:(/[A-Z]/i.test(r.t[0])?r.t[0].toUpperCase():'#');
const inTab=k=>R.map((r,i)=>({r,i})).filter(x=>keyOf(x.r)===k);
function drawCard(){
  const r=R[sel],w=look==='wild',el=$('card'),ty=w?r.type:'typed';
  el.className='card '+(ty==='typed'||ty==='hand'||ty==='card'?'lined ':'')+'t-'+ty;void el.offsetWidth;el.classList.add('enter');
  el.setAttribute('aria-label',r.t+' recipe card');
  el.innerHTML='<h2>'+r.t+'</h2><div class="meta">Serves '+r.s+' · '+r.m+' min · '+r.cat+(w?' · '+SRC[r.type]:'')+'</div><h3>Ingredients</h3><ul>'+r.ing.map(x=>'<li>'+x+'</li>').join('')+'</ul><h3>Directions</h3><ol>'+r.st.map(x=>'<li>'+x+'</li>').join('')+'</ol>';
}
function drawTabs(){
  const t=$('tabs'),az=sort==='az';
  const keys=az?LET.filter(k=>inTab(k).length).map(k=>[k]):CATS;
  const stag=az&&keys.length>12;t.className='tabs'+(az?' az':'')+(stag?' stag':'');t.innerHTML='';
  keys.forEach((kk,i)=>{
    const k=kk[0],b=document.createElement('button'),n=inTab(k).length;
    b.className='tab'+(kk[1]&&look==='wild'?' hand':'');b.textContent=k;b.disabled=!n;b.dataset.k=k;
    b.setAttribute('aria-expanded',open===k);b.setAttribute('aria-controls','fan');
    b.setAttribute('aria-label',k+', '+n+(n===1?' card':' cards'));
    b.onclick=()=>toggle(k);
    if(stag){const N=keys.length+1;Object.assign(b.style,{left:(i/N*100)+'%',width:(2/N*100)+'%',top:i%2?'24px':'0',height:i%2?'30px':'38px',zIndex:i%2?2:1})}
    t.appendChild(b);
    if(az&&!stag){const a=LET.indexOf(k),nx=keys[i+1],e=nx?LET.indexOf(nx[0]):LET.length;if(e-a>1){const s=document.createElement('span');s.className='sliver';s.setAttribute('aria-hidden','true');s.title=LET[a+1]+(e-a>2?'–'+LET[e-1]:'')+' (no recipes)';t.appendChild(s)}}
  });
}
function toggle(k){open=open===k?null:k;drawTabs();drawFan();if(open)$('live').textContent=k+', '+inTab(k).length+' cards'}
function drawFan(){
  const f=$('fan');f.innerHTML='';f.hidden=!open;if(!open)return;
  inTab(open).forEach((x,i)=>{
    const b=document.createElement('button');b.className='mini';b.style.setProperty('--i',i);
    b.innerHTML='<b>'+x.r.t+'</b>';
    b.onclick=()=>{sel=x.i;open=null;drawCard();drawTabs();drawFan();$('live').textContent=x.r.t+' selected'};
    f.appendChild(b);
  });
}
// scrub: drag a finger along the A-Z tabs to jump between letters, with a big letter bubble
const bub=$('bubble');let scrubbing=false;
$('tabs').addEventListener('pointerdown',e=>{if(sort==='az'&&e.pointerType!=='mouse')scrubbing=true});
$('tabs').addEventListener('pointermove',e=>{
  if(!scrubbing)return;
  const el=document.elementFromPoint(e.clientX,e.clientY),b=el&&el.closest&&el.closest('.tab');
  if(b&&!b.disabled){bub.hidden=false;bub.textContent=b.dataset.k;bub.style.left=e.clientX+'px';bub.style.top=e.clientY+'px';if(open!==b.dataset.k){open=b.dataset.k;drawFanOnly()}}
});
function drawFanOnly(){drawFan();document.querySelectorAll('.tab').forEach(x=>x.setAttribute('aria-expanded',x.dataset.k===open))}
['pointerup','pointercancel'].forEach(ev=>addEventListener(ev,()=>{scrubbing=false;bub.hidden=true}));
document.querySelectorAll('[data-look]').forEach(b=>b.onclick=()=>{look=b.dataset.look;document.querySelectorAll('[data-look]').forEach(x=>x.setAttribute('aria-pressed',x===b));applyTab();drawCard();drawTabs()});
document.querySelectorAll('[data-sort]').forEach(b=>b.onclick=()=>{sort=b.dataset.sort;open=null;document.querySelectorAll('[data-sort]').forEach(x=>x.setAttribute('aria-pressed',x===b));drawTabs();drawFan()});
$('stress').onclick=e=>{
  const on=e.currentTarget.getAttribute('aria-pressed')!=='true';e.currentTarget.setAttribute('aria-pressed',on);
  R=BASE.slice();
  if(on)LET.slice(0,26).forEach(L=>{if(!R.some(r=>r.t[0].toUpperCase()===L))R.push({t:L+' sample dish',cat:'Entrées',type:'typed',s:4,m:30,ing:['1 cup something'],st:['Cook it.']})});
  sel=0;open=null;drawCard();drawTabs();drawFan();
};
document.addEventListener('keydown',e=>{if(e.key==='Escape'&&open){open=null;drawTabs();drawFan()}});
// Tidy tab color options (Wild West keeps the paper default)
const COLORS=[['Cream','#f1e3c4'],['Sage','#d9e8c8'],['Sky','#cfe0ee'],['Rose','#f3d4c4'],['Butter','#f2e6a8']];
let chosen=COLORS[0][1];
function applyTab(){document.documentElement.style.setProperty('--tab',look==='tidy'?chosen:COLORS[0][1]);$('colors').hidden=look!=='tidy'}
COLORS.forEach(([n,c],i)=>{const b=document.createElement('button');b.className='swatch';b.style.setProperty('--c',c);b.innerHTML='<i></i>';b.setAttribute('aria-label',n+' tabs');b.setAttribute('aria-pressed',i===0);b.onclick=()=>{chosen=c;document.querySelectorAll('.swatch').forEach(x=>x.setAttribute('aria-pressed',x===b));applyTab()};$('colors').appendChild(b)});
applyTab();
drawCard();drawTabs();drawFan();
</script>
</body>
</html>
