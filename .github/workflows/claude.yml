name: Claude

# Comment @claude on an issue or PR (or in a PR review) to hand it the task. Creating an
# issue never starts a run, and anything labelled `draft` is skipped.
# Only people with write access can trigger it. Uses the CLAUDE_CODE_OAUTH_TOKEN secret,
# so runs count against the Claude plan's usage limits instead of per-token API billing.
on:
  issue_comment:
    types: [created]
  pull_request_review_comment:
    types: [created]
  pull_request_review:
    types: [submitted]

# One run at a time per issue or PR; a new mention waits instead of running in parallel.
concurrency:
  group: claude-${{ github.event.issue.number || github.event.pull_request.number }}
  cancel-in-progress: false

jobs:
  claude:
    if: |
      !contains(github.event.issue.labels.*.name, 'draft') &&
      !contains(github.event.pull_request.labels.*.name, 'draft') &&
      (
        (github.event_name == 'issue_comment' && contains(github.event.comment.body, '@claude')) ||
        (github.event_name == 'pull_request_review_comment' && contains(github.event.comment.body, '@claude')) ||
        (github.event_name == 'pull_request_review' && contains(github.event.review.body, '@claude'))
      )
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write
      pull-requests: write
      issues: write
      id-token: write
      actions: read
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 1
      # Install what the tests need so Claude can run them before pushing.
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
        working-directory: frontend
      - run: npx playwright install --with-deps chromium
        working-directory: frontend
      - uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          base_branch: staging-render
          # Tests and builds, plus git to read history and switch to an existing
          # claude/issue-N-* branch (CLAUDE.md). Pushing stays on the action's wrapper.
          claude_args: |
            --max-turns 60
            --allowedTools "Bash(python manage.py:*),Bash(npm run build),Bash(npm run test:e2e),Bash(npm --prefix frontend run:*),Bash(git fetch:*),Bash(git log:*),Bash(git diff:*),Bash(git status:*),Bash(git ls-remote:*),Bash(git switch:*)"
