name: Claude review

# Reviews each PR into staging-render once when it opens or leaves draft.
on:
  pull_request:
    types: [opened, ready_for_review]
    branches: [staging-render]

jobs:
  review:
    if: github.event.pull_request.draft == false && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
      id-token: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - uses: anthropics/claude-code-action@v1
        with:
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          prompt: |
            Review this pull request against CLAUDE.md and the rules in .cursor/rules/.
            Focus on correctness, security, and whether it meets the "Done when" of the issue it closes.
            Post findings as one PR comment. Do not push changes.
