version: 2
updates:
  - package-ecosystem: pip
    directory: /
    target-branch: staging-render
    schedule:
      interval: weekly
  - package-ecosystem: npm
    directory: /frontend
    target-branch: staging-render
    schedule:
      interval: weekly
    groups:
      frontend-minor:
        update-types: [minor, patch]
  - package-ecosystem: github-actions
    directory: /
    target-branch: staging-render
    schedule:
      interval: weekly
